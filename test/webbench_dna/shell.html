<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-Bench DOM</title>
    <style>
      /* Public shell for the Web-Bench dom1 stage: layout only (the official init task).  Everything a task adds
         (tool buttons, entries, menus, resizer, their CSS) is created by the compiled candidate script. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 100%; height: 100vh; background-color: #1f1f1f; color: #eee; font-family: 'Courier New', Courier, monospace; }
      .explorer { width: 100%; height: 100%; display: flex; }
      .leftbar { position: relative; width: 300px; flex-shrink: 0; height: 100%; border-right: 1px solid #444; display: flex; flex-direction: column; background-color: #252525; overflow-y: auto; }
      .editor { flex: 1; height: 100%; background-color: #1f1f1f; color: #eee; border: 0; padding: 1rem; font-size: 14px; line-height: 1.5; outline: none; }
      .tools { flex: 0 0 40px; display: flex; justify-content: flex-end; align-items: center; background-color: #252525; border-bottom: 1px solid #444; }
      .tools button { height: 20px; line-height: 20px; padding: 0 4px; margin-right: 4px; background-color: #2f2f2f; color: #eee; border: 1px solid #444; border-radius: 3px; cursor: pointer; }
      .tools button:hover { background-color: #3f3f3f; border-color: #666; }
      .entries { flex: 1; display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div class="explorer">
      <div class="leftbar">
        <div class="tools"></div>
        <div class="entries"></div>
      </div>
      <textarea class="editor"></textarea>
    </div>
    <script>/*__CANDIDATE__*/</script>
  </body>
</html>
